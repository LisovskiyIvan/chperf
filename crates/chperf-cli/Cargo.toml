[package]
name = "chperf-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "chperf"
path = "src/main.rs"

[dependencies]
chperf-core = { path = "../chperf-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
